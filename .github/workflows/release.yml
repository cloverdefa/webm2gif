name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_type:
        description: Release version type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'test'
      )

    runs-on: windows-latest

    steps:
      # ============================================================
      # Checkout main
      # ============================================================

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # ============================================================
      # Setup Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ============================================================
      # Install dependencies
      # ============================================================

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller py7zr

      # ============================================================
      # Build executable
      # ============================================================

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller webm2gif.spec

      # ============================================================
      # Get next version
      # ============================================================

      - name: Get next version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git fetch --tags --force

          # ----------------------------------------------------------
          # Find latest semantic version tag
          # ----------------------------------------------------------

          $latestTag = @(
            git tag --list "v*" |
            Where-Object {
              $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$'
            } |
            Sort-Object {
              $parts = $_.Substring(1).Split('.')

              [version]::new(
                [int]$parts[0],
                [int]$parts[1],
                [int]$parts[2]
              )
            }
          ) |
          Select-Object -Last 1

          # ----------------------------------------------------------
          # Determine release type
          #
          # PR merge:
          #   patch
          #
          # Manual:
          #   patch / minor / major
          # ----------------------------------------------------------

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $releaseType = "${{ inputs.release_type }}"
          }
          else {
            $releaseType = "patch"
          }

          Write-Host "Latest tag: $latestTag"
          Write-Host "Release type: $releaseType"

          # ----------------------------------------------------------
          # Calculate next version
          # ----------------------------------------------------------

          if (-not $latestTag) {
            switch ($releaseType) {
              "patch" {
                $major = 0
                $minor = 1
                $patch = 1
              }

              "minor" {
                $major = 0
                $minor = 2
                $patch = 0
              }

              "major" {
                $major = 1
                $minor = 0
                $patch = 0
              }

              default {
                throw "Invalid release type: $releaseType"
              }
            }
          }
          else {
            $parts = $latestTag.Substring(1).Split('.')

            $major = [int]$parts[0]
            $minor = [int]$parts[1]
            $patch = [int]$parts[2]

            switch ($releaseType) {
              "patch" {
                $patch++
              }

              "minor" {
                $minor++
                $patch = 0
              }

              "major" {
                $major++
                $minor = 0
                $patch = 0
              }

              default {
                throw "Invalid release type: $releaseType"
              }
            }
          }

          $version = "$major.$minor.$patch"
          $tag = "v$version"

          # ----------------------------------------------------------
          # Prevent duplicate tag
          # ----------------------------------------------------------

          if (git tag --list $tag) {
            throw "Tag $tag already exists."
          }

          Write-Host "Next version: $version"
          Write-Host "Release tag:  $tag"

          "version=$version" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

          "tag=$tag" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

      # ============================================================
      # Create Release
      # ============================================================

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/webm2gif.exe
