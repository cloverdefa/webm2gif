name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check merge source
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $prs = gh api `
            -H "Accept: application/vnd.github+json" `
            "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls"

          if (-not $prs -or $prs -eq "[]") {
            Write-Host "No pull request found for this commit."
            "should_release=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $pr = $prs | ConvertFrom-Json | Select-Object -First 1

          Write-Host "PR #$($pr.number)"
          Write-Host "Head: $($pr.head.ref)"
          Write-Host "Base: $($pr.base.ref)"

          if (
            $pr.base.ref -eq "main" -and
            $pr.head.ref -eq "test"
          ) {
            Write-Host "Detected test -> main merge."
            "should_release=true" >> $env:GITHUB_OUTPUT
          }
          else {
            Write-Host "Not a test -> main merge. Skipping release."
            "should_release=false" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout
        if: steps.pr.outputs.should_release == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        if: steps.pr.outputs.should_release == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        if: steps.pr.outputs.should_release == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller py7zr

      - name: Build executable
        if: steps.pr.outputs.should_release == 'true'
        run: pyinstaller webm2gif.spec

      - name: Get next version
        if: steps.pr.outputs.should_release == 'true'
        id: version
        shell: pwsh
        run: |
          git fetch --tags

          $tags = git tag --list "v1.0.*"

          if (-not $tags) {
            $patch = 1
          }
          else {
            $patch = ($tags |
              ForEach-Object {
                [int]($_ -replace '^v1\.0\.', '')
              } |
              Measure-Object -Maximum).Maximum

            $patch++
          }

          $version = "1.0.$patch"
          $tag = "v$version"

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create Release
        if: steps.pr.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/webm2gif.exe
