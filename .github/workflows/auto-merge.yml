name: Auto Merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >
      github.event.pull_request.user.login == 'cloverdefa' &&
      github.event.pull_request.base.ref == 'main' &&
      contains(fromJSON('["dev", "test"]'), github.event.pull_request.head.ref) &&
      github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}

        run: |
          gh pr merge "$PR_URL" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash

      - name: Wait for merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

        run: |
          echo "Waiting for PR #$PR_NUMBER to be merged..."

          for i in {1..60}; do
            STATE=$(gh pr view "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --json state \
              --jq '.state')

            MERGED_AT=$(gh pr view "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --json mergedAt \
              --jq '.mergedAt')

            echo "State: $STATE"
            echo "Merged at: $MERGED_AT"

            if [ "$STATE" = "MERGED" ]; then
              echo "PR #$PR_NUMBER has been merged."
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for PR to merge."
          exit 1
